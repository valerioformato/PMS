build-alma9:
  extends: [ ".build-docker" ]
  image: vformato/pms-ci:alma9

test-alma9:
  extends: [ ".test" ]
  image: vformato/pms-ci:alma9
  needs: [ "build-alma9" ]

build-for-cvmfs-alma9:
  extends: [ ".build-and-install" ]
  image: vformato/pms-ci:alma9
  only:
    - upgrade-ci
    - /^v[0-9]*\.[0-9]*(\.[0-9]*)$/  # ex: v0.1.0
    - /^v[0-9]*\.[0-9]*(_RC[0-9]+.*)$/ # ex: v1.0_RC1, v1.0_RC1b

cvmfs-deploy-alma9:
  extends: [ ".cvmfs-deploy" ]
  image: vformato/amsitaly:alma9
  needs: [ "build-for-cvmfs-alma9", "test-alma9" ]
  only:
    - upgrade-ci
    - /^v[0-9]*\.[0-9]*(\.[0-9]*)$/  # ex: v0.1.0
    - /^v[0-9]*\.[0-9]*(_RC[0-9]+.*)$/ # ex: v1.0_RC1, v1.0_RC1b
  variables:
    GIT_STRATEGY: none
